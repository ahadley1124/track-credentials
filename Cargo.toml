[package]
name = "track-credentials"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = { version = "0.5.0", features = ["json"] }
surrealdb = "1.1.1"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
webauthn-rs = "0.4"
base64 = "0.21"
urlencoding = "2.1"

[dependencies.rocket_dyn_templates]
version = "0.1.0"
features = ["tera"]
